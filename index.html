<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 2026 Live Tracker (Dynamic IST)</title>
    <style>
        :root { --f1-red: #e10600; --bg-dark: #050505; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; }
        
        #video-bg {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -10; filter: brightness(0.3); object-fit: cover;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.85)); z-index: -5; }

        .app-layout { display: flex; height: 100vh; width: 100vw; box-sizing: border-box; z-index: 10; position: relative; overflow: hidden; }

        .sidebar {
            width: 320px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            padding: 20px 12px;
            box-sizing: border-box;
            flex-shrink: 0;
            mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .sidebar-item {
            padding: 11px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); }
        .sidebar-item.active { background: var(--f1-red); font-weight: bold; border-color: rgba(255,255,255,0.25); }
        .sidebar-item .round-num { font-size: 0.68rem; text-transform: uppercase; color: #bbb; letter-spacing: 1px; }
        .sidebar-item.active .round-num { color: #ffe5e5; }
        .sidebar-item .loc-name { font-size: 0.95rem; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
        .sidebar-item .status-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 4px; background: rgba(255,255,255,0.18); display: inline-block; margin-top: 4px; font-weight: 600; }
        .sidebar-item.active .status-badge { background: rgba(0,0,0,0.35); }

        .main-content {
            flex-grow: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            max-width: 840px;
            margin: 0 auto;
            box-sizing: border-box;
            height: 100vh;
        }

        .header { border-left: 4px solid var(--f1-red); padding-left: 18px; margin-bottom: 24px; flex-shrink: 0; }
        .header p { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #aaa; }
        .header h1 { margin: 6px 0; font-size: 2.3rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .full-name { font-size: 0.85rem !important; color: #aaa !important; letter-spacing: 0 !important; }

        .session-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.06); padding: 13px 20px;
            margin-bottom: 10px; border-radius: 6px; backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .session-left { display: flex; flex-direction: column; gap: 4px; }
        .name { font-weight: 800; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 0.5px; }
        .ist { color: #f59e0b; font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .ist-date { color: #aaa; font-weight: normal; }
        
        .timer { font-family: 'SF Mono', Consolas, monospace; color: var(--f1-red); font-size: 1.15rem; font-weight: 700; min-width: 150px; text-align: right; }
        .timer.live { color: #10b981; animation: pulse 1.2s infinite; }
        .timer.finished { color: #6b7280; font-size: 0.9rem; font-weight: 500; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.35; }
            100% { opacity: 1; }
        }

        .info-card {
            background: rgba(14, 14, 14, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 18px 22px;
            backdrop-filter: blur(12px);
            margin-bottom: 25px;
        }

        .info-card h3 { 
            margin-top: 0; text-transform: uppercase; font-size: 0.95rem; 
            color: var(--f1-red); letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        
        .api-indicator { font-size: 0.65rem; color: #10b981; text-transform: none; font-weight: normal; }
        .results-section { margin-bottom: 16px; }
        .session-title { font-size: 0.8rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }
        
        .podium-list, .standings-list { display: flex; flex-direction: column; gap: 6px; }
        .podium-item, .standing-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.04); padding: 9px 14px; border-radius: 4px; font-size: 0.9rem; 
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .pos-badge { font-weight: 800; width: 32px; color: var(--f1-red); }
        .loader { text-align: center; padding: 40px; color: #888; font-size: 1rem; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="video-bg">
        <source src="For1.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="app-layout">
        <div class="sidebar" id="sidebar"></div>
        <div class="main-content" id="ui">
            <div class="loader">Fetching official 2026 Formula 1 season schedule & real-time IST timings...</div>
        </div>
    </div>

    <script>
        let cal = [];
        let standings = [];
        let selectedRound = null;
        let lastRenderedState = null;
        const seasonYear = 2026;

        // Auto-convert any incoming UTC date and time into exact Indian Standard Time (Asia/Kolkata)
        function formatToIST(dateStr, timeStr) {
            const utcString = `${dateStr}T${timeStr ? (timeStr.endsWith('Z') ? timeStr : timeStr + 'Z') : '12:00:00Z'}`;
            const d = new Date(utcString);
            
            const timePart = d.toLocaleTimeString('en-IN', { 
                timeZone: 'Asia/Kolkata', 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: true 
            });
            const dayPart = d.toLocaleDateString('en-IN', { 
                timeZone: 'Asia/Kolkata', 
                weekday: 'short', 
                day: '2-digit', 
                month: 'short' 
            });

            return { iso: d.toISOString(), timePart, dayPart, rawDate: d };
        }

        // Fetch official Calendar from Jolpica / Ergast API with real UTC session schedules
        async function loadSeasonSchedule() {
            try {
                const res = await fetch(`https://api.jolpi.ca/ergast/f1/${seasonYear}.json`);
                const data = await res.json();
                const races = data.MRData.RaceTable.Races;

                cal = races.map(r => {
                    const sessions = [];

                    // FP1
                    if (r.FirstPractice) {
                        const parsed = formatToIST(r.FirstPractice.date, r.FirstPractice.time);
                        sessions.push({ n: "Practice 1", t: parsed.iso, timePart: parsed.timePart, dayPart: parsed.dayPart });
                    }
                    // FP2 or Sprint Qualifying
                    if (r.SprintQualifying) {
                        const parsed = formatToIST(r.SprintQualifying.date, r.SprintQualifying.time);
                        sessions.push({ n: "Sprint Qualifying", t: parsed.iso, timePart: parsed.timePart, dayPart: parsed.dayPart });
                    } else if (r.SecondPractice) {
                        const parsed = formatToIST(r.SecondPractice.date, r.SecondPractice.time);
                        sessions.push({ n: "Practice 2", t: parsed.iso, timePart: parsed.timePart, dayPart: parsed.dayPart });
                    }
                    // FP3 or Sprint
                    if (r.Sprint) {
                        const parsed = formatToIST(r.Sprint.date, r.Sprint.time);
                        sessions.push({ n: "Sprint", t: parsed.iso, timePart: parsed.timePart, dayPart: parsed.dayPart });
                    } else if (r.ThirdPractice) {
                        const parsed = formatToIST(r.ThirdPractice.date, r.ThirdPractice.time);
                        sessions.push({ n: "Practice 3", t: parsed.iso, timePart: parsed.timePart, dayPart: parsed.dayPart });
                    }
                    // Qualifying
                    if (r.Qualifying) {
                        const parsed = formatToIST(r.Qualifying.date, r.Qualifying.time);
                        sessions.push({ n: "Qualifying", t: parsed.iso, timePart: parsed.timePart, dayPart: parsed.dayPart });
                    }
                    // Main Grand Prix Race
                    const parsedRace = formatToIST(r.date, r.time || "12:00:00Z");
                    sessions.push({ n: "Race", t: parsedRace.iso, timePart: parsedRace.timePart, dayPart: parsedRace.dayPart });

                    return {
                        r: parseInt(r.round),
                        loc: r.Circuit.circuitName.replace(" Circuit", "").replace(" International", ""),
                        full: r.raceName,
                        date: r.date,
                        sessions: sessions,
                        results: {}
                    };
                });

                selectedRound = getUpcomingRound();
                await loadStandings();
                renderSidebar();
                renderMainContent();
            } catch (err) {
                console.error("Calendar fetch error, reverting to verified local schedule:", err);
                // Fallback to verified local schedule if network fails
                loadFallbackSchedule();
            }
        }

        // Live Driver Standings
        async function loadStandings() {
            try {
                const res = await fetch(`https://api.jolpi.ca/ergast/f1/${seasonYear}/driverStandings.json`);
                const data = await res.json();
                const list = data?.MRData?.StandingsTable?.StandingsLists?.[0]?.DriverStandings || [];
                standings = list.slice(0, 10).map(s => ({
                    pos: s.position,
                    driver: `${s.Driver.givenName} ${s.Driver.familyName}`,
                    team: s.Constructors?.[0]?.name || "F1",
                    pts: s.points
                }));
            } catch (err) {
                console.warn("Standings fetch standby:", err);
            }
        }

        // Fetch Top 3 classifications dynamically for any finished session / race
        async function loadSessionResults(round) {
            const race = cal.find(r => r.r === round);
            if (!race || Object.keys(race.results).length > 0) return;

            try {
                // Fetch Race Results
                const res = await fetch(`https://api.jolpi.ca/ergast/f1/${seasonYear}/${round}/results.json`);
                const data = await res.json();
                const results = data?.MRData?.RaceTable?.Races?.[0]?.Results;
                if (results && results.length >= 3) {
                    race.results["Race"] = results.slice(0, 3).map(d => `${d.Driver.givenName} ${d.Driver.familyName}`);
                }

                // Fetch Qualifying Results
                const qRes = await fetch(`https://api.jolpi.ca/ergast/f1/${seasonYear}/${round}/qualifying.json`);
                const qData = await qRes.json();
                const qResults = qData?.MRData?.RaceTable?.Races?.[0]?.QualifyingResults;
                if (qResults && qResults.length >= 3) {
                    race.results["Qualifying"] = qResults.slice(0, 3).map(d => `${d.Driver.givenName} ${d.Driver.familyName}`);
                }

                // Fetch Sprint Results if applicable
                const spRes = await fetch(`https://api.jolpi.ca/ergast/f1/${seasonYear}/${round}/sprint.json`);
                const spData = await spRes.json();
                const spResults = spData?.MRData?.RaceTable?.Races?.[0]?.SprintResults;
                if (spResults && spResults.length >= 3) {
                    race.results["Sprint"] = spResults.slice(0, 3).map(d => `${d.Driver.givenName} ${d.Driver.familyName}`);
                }

                renderMainContent();
            } catch (e) {
                console.warn("Results API fetch:", e);
            }
        }

        function isRaceComplete(race) {
            const now = Date.now();
            const lastSession = race.sessions[race.sessions.length - 1];
            const lastSessionEnd = new Date(lastSession.t).getTime() + (2.5 * 3600 * 1000);
            return now > lastSessionEnd;
        }

        function getUpcomingRound() {
            const upcoming = cal.find(r => !isRaceComplete(r));
            return upcoming ? upcoming.r : cal[cal.length - 1]?.r || 1;
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = cal.map(r => {
                const complete = isRaceComplete(r);
                const statusText = complete ? "COMPLETED" : (r.r === selectedRound ? "LIVE / UPCOMING" : "");
                return `
                    <div class="sidebar-item ${r.r === selectedRound ? 'active' : ''}" onclick="selectRound(${r.r})">
                        <div class="round-num">Round ${r.r}</div>
                        <div class="loc-name">${r.loc}</div>
                        ${statusText ? `<div class="status-badge">${statusText}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function selectRound(rNum) {
            selectedRound = rNum;
            lastRenderedState = null; 
            renderSidebar();
            renderMainContent();
        }

        function renderMainContent() {
            const race = cal.find(r => r.r === selectedRound);
            if (!race) return;

            const complete = isRaceComplete(race);
            if (complete) loadSessionResults(race.r);

            if (lastRenderedState === complete) {
                updateTimers();
                return;
            }
            lastRenderedState = complete;
            
            let html = `
                <div class="header">
                    <p>ROUND ${race.r} | OFFICIAL SCHEDULE</p>
                    <h1>${race.loc}</h1>
                    <p class="full-name">${race.full}</p>
                </div>
            `;
            
            if (!complete) {
                html += `<div id="countdown-container">`;
                race.sessions.forEach((s, idx) => {
                    html += `
                        <div class="session-row">
                            <div class="session-left">
                                <div class="name">${s.n}</div>
                                <div class="ist">
                                    <span>${s.timePart} IST</span>
                                    <span class="ist-date">(${s.dayPart})</span>
                                </div>
                            </div>
                            <div class="timer" id="timer-${idx}">--</div>
                        </div>`;
                });
                html += `</div>`;

                if (standings.length > 0) {
                    html += `
                        <div class="info-card" style="margin-top: 25px;">
                            <h3>Official Drivers' Championship <span class="api-indicator">● Live Jolpica API</span></h3>
                            <div class="standings-list">
                                ${standings.map(st => `
                                    <div class="standing-item">
                                        <div><span class="pos-badge">P${st.pos}</span> <strong>${st.driver}</strong> <span style="color:#888; font-size:0.8rem; margin-left: 5px;">${st.team}</span></div>
                                        <div style="font-family: monospace; color: var(--f1-red); font-weight: bold;">${st.pts} PTS</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                }
            } else {
                html += `
                    <div class="info-card">
                        <h3>Session Classifications <span class="api-indicator">● Official Sync</span></h3>
                        <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 10px;">
                            ${Object.keys(race.results).length > 0 ? Object.entries(race.results).map(([sessName, top3]) => `
                                <div class="results-section">
                                    <div class="session-title">${sessName} Top 3</div>
                                    <div class="podium-list">
                                        <div class="podium-item"><span class="pos-badge">1st</span> <strong>🥇 ${top3[0] || 'TBD'}</strong></div>
                                        <div class="podium-item"><span class="pos-badge">2nd</span> <strong>🥈 ${top3[1] || 'TBD'}</strong></div>
                                        <div class="podium-item"><span class="pos-badge">3rd</span> <strong>🥉 ${top3[2] || 'TBD'}</strong></div>
                                    </div>
                                </div>
                            `).join('') : '<div style="padding: 10px; color: #888;">Fetching live session timing classifications...</div>'}
                        </div>
                    </div>`;
            }

            document.getElementById('ui').innerHTML = html;
            updateTimers();
        }

        function updateTimers() {
            const now = Date.now();
            const race = cal.find(r => r.r === selectedRound);
            if (!race) return;

            const complete = isRaceComplete(race);
            if (complete) {
                if (lastRenderedState !== true) renderMainContent();
                return;
            }

            race.sessions.forEach((s, idx) => {
                const target = new Date(s.t).getTime();
                const diff = target - now;
                const timerEl = document.getElementById(`timer-${idx}`);
                if (!timerEl) return;

                // Practice/Qualy lasts ~1.5 hours (5400000ms), Race ~2.5 hours (9000000ms)
                const duration = s.n === "Race" ? 9000000 : 5400000;

                if (diff <= 0 && diff > -duration) {
                    timerEl.innerText = "● LIVE";
                    timerEl.className = "timer live";
                } else if (diff > 0) {
                    const d = Math.floor(diff / 86400000);
                    const h = Math.floor((diff % 86400000) / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const sec = Math.floor((diff % 60000) / 1000);
                    timerEl.innerText = `${d > 0 ? d + 'd ' : ''}${h}h ${m}m ${sec}s`;
                    timerEl.className = "timer";
                } else { 
                    timerEl.innerText = "COMPLETED"; 
                    timerEl.className = "timer finished";
                }
            });

            if (isRaceComplete(race) !== lastRenderedState) {
                renderSidebar();
                renderMainContent();
            }
        }

        function loadFallbackSchedule() {
            // Strict IST Fallback if offline
            cal = [
                { r: 16, loc: "Bahrain (at Sepang)", full: "FORMULA 1 GULF AIR BAHRAIN GRAND PRIX IN MALAYSIA 2026", date: "02-04 OCT", results: {},
                  sessions: [
                    {n:"Practice 1", t:"2026-10-02T10:00:00+05:30", timePart:"10:00 AM", dayPart:"Fri, 02 Oct"},
                    {n:"Practice 2", t:"2026-10-02T13:30:00+05:30", timePart:"01:30 PM", dayPart:"Fri, 02 Oct"},
                    {n:"Practice 3", t:"2026-10-03T10:00:00+05:30", timePart:"10:00 AM", dayPart:"Sat, 03 Oct"},
                    {n:"Qualifying", t:"2026-10-03T13:30:00+05:30", timePart:"01:30 PM", dayPart:"Sat, 03 Oct"},
                    {n:"Race", t:"2026-10-04T12:30:00+05:30", timePart:"12:30 PM", dayPart:"Sun, 04 Oct"}
                ]}
            ];
            selectedRound = 16;
            renderSidebar();
            renderMainContent();
        }

        window.addEventListener('load', () => { 
            const v = document.getElementById('video-bg');
            if (v) v.play().catch(() => {});
            loadSeasonSchedule();
        });

        setInterval(updateTimers, 1000);
    </script>
</body>
</html>
