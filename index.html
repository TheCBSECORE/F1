    <style>
        :root { --f1-red: #e10600; --bg-dark: #050505; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; }
        
        #video-bg {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -10; filter: brightness(0.3); object-fit: cover;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.85)); z-index: -5; }

        .app-layout { display: flex; height: 100vh; width: 100vw; box-sizing: border-box; z-index: 10; position: relative; overflow: hidden; }

        .sidebar {
            width: 320px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            padding: 20px 12px;
            box-sizing: border-box;
            flex-shrink: 0;
            mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .sidebar-item {
            padding: 11px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); }
        .sidebar-item.active { background: var(--f1-red); font-weight: bold; border-color: rgba(255,255,255,0.25); }
        .sidebar-item .round-num { font-size: 0.68rem; text-transform: uppercase; color: #bbb; letter-spacing: 1px; }
        .sidebar-item.active .round-num { color: #ffe5e5; }
        .sidebar-item .loc-name { font-size: 0.95rem; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
        .sidebar-item .status-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 4px; background: rgba(255,255,255,0.18); display: inline-block; margin-top: 4px; font-weight: 600; }
        .sidebar-item.active .status-badge { background: rgba(0,0,0,0.35); }

        .main-content {
            flex-grow: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            max-width: 840px;
            margin: 0 auto;
            box-sizing: border-box;
            height: 100vh;
        }

        .header { border-left: 4px solid var(--f1-red); padding-left: 18px; margin-bottom: 24px; flex-shrink: 0; }
        .header p { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #aaa; }
        .header h1 { margin: 6px 0; font-size: 2.3rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .full-name { font-size: 0.85rem !important; color: #aaa !important; letter-spacing: 0 !important; }

        .session-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.06); padding: 13px 20px;
            margin-bottom: 10px; border-radius: 6px; backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .session-left { display: flex; flex-direction: column; gap: 4px; }
        .name { font-weight: 800; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 0.5px; }
        .ist { color: #f59e0b; font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .ist-date { color: #aaa; font-weight: normal; }
        
        .timer { font-family: 'SF Mono', Consolas, monospace; color: var(--f1-red); font-size: 1.15rem; font-weight: 700; min-width: 150px; text-align: right; }
        .timer.live { color: #10b981; animation: pulse 1.2s infinite; }
        .timer.finished { color: #6b7280; font-size: 0.9rem; font-weight: 500; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.35; }
            100% { opacity: 1; }
        }

        .info-card {
            background: rgba(14, 14, 14, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 18px 22px;
            backdrop-filter: blur(12px);
            margin-bottom: 25px;
        }

        .info-card h3 { 
            margin-top: 0; text-transform: uppercase; font-size: 0.95rem; 
            color: var(--f1-red); letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        
        .api-indicator { font-size: 0.65rem; color: #10b981; text-transform: none; font-weight: normal; }
        .results-section { margin-bottom: 16px; }
        .results-section:last-child { margin-bottom: 0; }
        .session-title { font-size: 0.8rem; text-transform: uppercase; color: #f59e0b; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }
        
        .podium-list, .standings-list { display: flex; flex-direction: column; gap: 6px; }
        .podium-item, .standing-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.04); padding: 9px 14px; border-radius: 4px; font-size: 0.9rem; 
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .pos-badge { font-weight: 800; width: 32px; color: var(--f1-red); }
    </style>
</head>

                {n:"Sprint", t:"2026-11-07T19:30:00+05:30"}, {n:"Qualifying", t:"2026-11-07T23:00:00+05:30"}, {n:"Race", t:"2026-11-08T22:30:00+05:30"}]},
            { r: 21, loc: "Las Vegas", roundYear: 2026, full: "FORMULA 1 HEINEKEN LAS VEGAS GRAND PRIX 2026", date: "19-21 NOV",
              results: {},
              sessions: [
                {n:"Practice 1", t:"2026-11-20T08:00:00+05:30"}, {n:"Practice 2", t:"2026-11-20T11:30:00+05:30"},
                {n:"Practice 3", t:"2026-11-21T08:00:00+05:30"}, {n:"Qualifying", t:"2026-11-21T11:30:00+05:30"}, {n:"Race", t:"2026-11-22T09:30:00+05:30"}]},
            { r: 22, loc: "Qatar", roundYear: 2026, full: "FORMULA 1 QATAR AIRWAYS QATAR GRAND PRIX 2026", date: "27-29 NOV",
              results: {},
              sessions: [
                {n:"Practice 1", t:"2026-11-27T18:00:00+05:30"}, {n:"Sprint Qualy", t:"2026-11-27T22:00:00+05:30"},
                {n:"Sprint", t:"2026-11-28T19:00:00+05:30"}, {n:"Qualifying", t:"2026-11-28T23:00:00+05:30"}, {n:"Race", t:"2026-11-29T21:30:00+05:30"}]},
            { r: 23, loc: "Abu Dhabi", roundYear: 2026, full: "FORMULA 1 ETIHAD AIRWAYS ABU DHABI GRAND PRIX 2026", date: "04-06 DEC",
              results: {},
              sessions: [
                {n:"Practice 1", t:"2026-12-04T15:00:00+05:30"}, {n:"Practice 2", t:"2026-12-04T18:30:00+05:30"},
                {n:"Practice 3", t:"2026-12-05T16:00:00+05:30"}, {n:"Qualifying", t:"2026-12-05T19:30:00+05:30"}, {n:"Race", t:"2026-12-06T18:30:00+05:30"}]}
        ];

        let standings = [
            { pos: 1, driver: "Andrea Kimi Antonelli", team: "Mercedes", pts: 229 },
            { pos: 2, driver: "George Russell", team: "Mercedes", pts: 213 },
            { pos: 3, driver: "Lewis Hamilton", team: "Ferrari", pts: 153 },
            { pos: 4, driver: "Max Verstappen", team: "Red Bull", pts: 147 },
            { pos: 5, driver: "Lando Norris", team: "McLaren", pts: 146 },
            { pos: 6, driver: "Charles Leclerc", team: "Ferrari", pts: 144 },
            { pos: 7, driver: "Oscar Piastri", team: "McLaren", pts: 111 },
            { pos: 8, driver: "Isack Hadjar", team: "Red Bull", pts: 66 }
        ];

        function isRaceComplete(race) {
            const now = Date.now();
            const lastSession = race.sessions[race.sessions.length - 1];
            const lastSessionEnd = new Date(lastSession.t).getTime() + (2.5 * 3600 * 1000);
            return now > lastSessionEnd;
        }

        function getUpcomingRound() {
            const upcoming = cal.find(r => !isRaceComplete(r));
            return upcoming ? upcoming.r : cal[cal.length - 1].r;
        }

        let selectedRound = getUpcomingRound();
        let lastRenderedRound = null;

        // Background sync: Fetch new results for active and upcoming rounds
        async function fetchAutoResults(race) {
            if (race.results && race.results["Race"]) return;
            try {
                const response = await fetch(`https://api.jolpi.ca/ergast/f1/2026/${race.r}/results.json`);
                if (response.ok) {
                    const data = await response.json();
                    const raceData = data?.MRData?.RaceTable?.Races?.[0];
                    if (raceData?.Results?.length >= 3) {
                        const top3 = raceData.Results.slice(0, 3).map(d => `${d.Driver.givenName} ${d.Driver.familyName}`);
                        if (!race.results) race.results = {};
                        race.results["Race"] = top3;
                        if (selectedRound === race.r) renderMainContent();
                    }
                }
            } catch (err) {
                // Silently fails without breaking UI
            }
        }

        // Live Standings Sync
        async function syncLiveStandings() {
            try {
                const res = await fetch('https://api.jolpi.ca/ergast/f1/2026/driverStandings.json');
                if (res.ok) {
                    const data = await res.json();
                    const list = data?.MRData?.StandingsTable?.StandingsLists?.[0]?.DriverStandings || [];
                    if (list.length > 0) {
                        standings = list.slice(0, 8).map(s => ({
                            pos: s.position,
                            driver: `${s.Driver.givenName} ${s.Driver.familyName}`,
                            team: s.Constructors?.[0]?.name || "F1",
                            pts: s.points
                        }));
                        renderMainContent();
                    }
                }
            } catch (e) {}
        }

        function formatIST(isoDateStr) {
            const d = new Date(isoDateStr);
            const timePart = d.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true });
            const dayPart = d.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', weekday: 'short', day: '2-digit', month: 'short' });
            return { timePart, dayPart };
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = cal.map(r => {
                const complete = isRaceComplete(r);
                const statusText = complete ? "COMPLETED" : (r.r === selectedRound ? "LIVE / UPCOMING" : "");
                return `
                    <div class="sidebar-item ${r.r === selectedRound ? 'active' : ''}" onclick="selectRound(${r.r})">
                        <div class="round-num">Round ${r.r} | ${r.date}</div>
                        <div class="loc-name">${r.loc}</div>
                        ${statusText ? `<div class="status-badge">${statusText}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function selectRound(rNum) {
            selectedRound = rNum;
            lastRenderedRound = null; 
            renderSidebar();
            renderMainContent();
        }

        function renderMainContent() {
            const race = cal.find(r => r.r === selectedRound);
            if (!race) return;

            const complete = isRaceComplete(race);
            if (complete && (!race.results || !race.results["Race"])) {
                fetchAutoResults(race);
            }

            // Only skip re-render if round and completion state haven't changed
            if (lastRenderedRound === selectedRound) {
                updateTimers();
                return;
            }
            lastRenderedRound = selectedRound;

            let html = `
                <div class="header">
                    <p>ROUND ${race.r} | ${race.date}</p>
                    <h1>${race.loc}</h1>
                    <p class="full-name">${race.full}</p>
                </div>
            `;

            if (!complete) {
                html += `<div id="countdown-container">`;
                race.sessions.forEach((s, idx) => {
                    const { timePart, dayPart } = formatIST(s.t);
                    html += `
                        <div class="session-row" data-time="${s.t}">
                            <div class="session-left">
                                <div class="name">${s.n}</div>
                                <div class="ist">
                                    <span>${timePart} IST</span>
                                    <span class="ist-date">(${dayPart})</span>
                                </div>
                            </div>
                            <div class="timer" id="timer-${idx}">--</div>
                        </div>`;
                });
                html += `</div>`;

                if (race.results && Object.keys(race.results).length > 0) {
                    html += `
                        <div class="info-card" style="margin-top: 20px;">
                            <h3>Weekend Completed Sessions</h3>
                            <div style="display:flex; flex-direction:column; gap:14px; margin-top:10px;">
                                ${Object.entries(race.results).map(([sName, top3]) => `
                                    <div class="results-section">
                                        <div class="session-title">${sName} Top 3</div>
                                        <div class="podium-list">
                                            <div class="podium-item"><span class="pos-badge">1st</span> <strong>🥇 ${top3[0]}</strong></div>
                                            <div class="podium-item"><span class="pos-badge">2nd</span> <strong>🥈 ${top3[1]}</strong></div>
                                            <div class="podium-item"><span class="pos-badge">3rd</span> <strong>🥉 ${top3[2]}</strong></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                }

                html += `
                    <div class="info-card" style="margin-top: 15px;">
                        <h3>Official Drivers' Championship <span class="api-indicator">● Live Points</span></h3>
                        <div class="standings-list">
                            ${standings.map(st => `
                                <div class="standing-item">
                                    <div><span class="pos-badge">P${st.pos}</span> <strong>${st.driver}</strong> <span style="color:#888; font-size:0.8rem; margin-left: 5px;">${st.team}</span></div>
                                    <div style="font-family: monospace; color: var(--f1-red); font-weight: bold;">${st.pts} PTS</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            } else {
                const resultsAvailable = race.results && Object.keys(race.results).length > 0;
                html += `
                    <div class="info-card">
                        <h3>Full Weekend Session Classifications <span class="api-indicator">● Official Results</span></h3>
                        <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 12px;">
                            ${resultsAvailable ? Object.entries(race.results).map(([sessName, top3]) => `
                                <div class="results-section">
                                    <div class="session-title">${sessName} Top 3</div>
                                    <div class="podium-list">
                                        <div class="podium-item"><span class="pos-badge">1st</span> <strong>🥇 ${top3[0] || 'TBD'}</strong></div>
                                        <div class="podium-item"><span class="pos-badge">2nd</span> <strong>🥈 ${top3[1] || 'TBD'}</strong></div>
                                        <div class="podium-item"><span class="pos-badge">3rd</span> <strong>🥉 ${top3[2] || 'TBD'}</strong></div>
                                    </div>
                                </div>
                            `).join('') : '<div style="padding: 10px; color: #888;">Classifications being processed...</div>'}
                        </div>
                    </div>`;
            }

            document.getElementById('ui').innerHTML = html;
            updateTimers();
        }

        function updateTimers() {
            const now = Date.now();
            const race = cal.find(r => r.r === selectedRound);
            if (!race) return;

            const complete = isRaceComplete(race);
            if (complete) return;

            race.sessions.forEach((s, idx) => {
                const target = new Date(s.t).getTime();
                const diff = target - now;
                const timerEl = document.getElementById(`timer-${idx}`);
                if (!timerEl) return;

                const duration = s.n === "Race" ? 7200000 : 3600000;

                if (diff <= 0 && diff > -duration) {
                    timerEl.innerText = "● LIVE";
                    timerEl.className = "timer live";
                } else if (diff > 0) {
                    const d = Math.floor(diff / 86400000);
                    const h = Math.floor((diff % 86400000) / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const sec = Math.floor((diff % 60000) / 1000);
                    timerEl.innerText = `${d > 0 ? d + 'd ' : ''}${h}h ${m}m ${sec}s`;
                    timerEl.className = "timer";
                } else { 
                    timerEl.innerText = "COMPLETED"; 
                    timerEl.className = "timer finished";
                }
            });
        }

        window.addEventListener('load', () => { 
            const v = document.getElementById('video-bg');
            if (v) v.play().catch(() => {});
            renderSidebar();
            renderMainContent();
            syncLiveStandings();
        });

        setInterval(updateTimers, 1000);
    </script>
</body>
</html>
