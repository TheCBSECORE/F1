    <meta charset="UTF-8">

    <style>
        :root { --f1-red: #e10600; --bg-dark: #050505; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: white; overflow: hidden; height: 100vh; }
        
        /* Video Background */
        #video-bg {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -10; filter: brightness(0.35); object-fit: cover;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7)); z-index: -5; }

        /* App Layout */
        .app-layout { display: flex; height: 100vh; width: 100vw; box-sizing: border-box; z-index: 10; position: relative; }

        /* Left Scrollable Sidebar */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            padding: 20px 10px;
            box-sizing: border-box;
            flex-shrink: 0;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .sidebar-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 0.85s;
        }

        .sidebar-item:hover { background: rgba(255, 255, 255, 0.1); }
        .sidebar-item.active { background: var(--f1-red); font-weight: bold; }
        .sidebar-item .round-num { font-size: 0.7rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        .sidebar-item.active .round-num { color: #ffcccc; }
        .sidebar-item .loc-name { font-size: 0.9rem; text-transform: uppercase; font-weight: 700; }

        /* Main Content Container */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 750px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .header { border-left: 4px solid var(--f1-red); padding-left: 15px; margin-bottom: 20px; }
        .header p { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #aaa; }
        .header h1 { margin: 5px 0; font-size: 2.3rem; text-transform: uppercase; line-height: 1; }
        .full-name { font-size: 0.82rem !important; color: #888 !important; letter-spacing: 0 !important; }

        .session-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.08); padding: 10px 18px;
            margin-bottom: 8px; border-radius: 4px; backdrop-filter: blur(8px);
        }

        .name { font-weight: 800; text-transform: uppercase; font-size: 0.95rem; }
        .ist { color: #888; font-size: 0.75rem; margin-top: 2px; }
        .timer { font-family: monospace; color: var(--f1-red); font-size: 1.15rem; font-weight: bold; }

        /* Standings & Podiums Box */
        .info-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 15px 20px;
            backdrop-filter: blur(10px);
            max-height: 380px;
            overflow-y: auto;
        }

        .info-card h3 { margin-top: 0; text-transform: uppercase; font-size: 1rem; color: var(--f1-red); letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        
        .podium-list, .standings-list { display: flex; flex-direction: column; gap: 8px; }
        .podium-item, .standing-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 4px; font-size: 0.9rem; }
        .pos-badge { font-weight: bold; width: 25px; color: var(--f1-red); }
    </style>
</head>

        }

        function selectRound(rNum) {
            selectedRound = rNum;
            renderSidebar();
            up();
        }

        function up() {
            const now = new Date();
            const race = cal.find(r => r.r === selectedRound);
            const isUpcoming = new Date(race.sessions[race.sessions.length - 1].t) > now;
            
            let html = `<div class="header"><p>ROUND ${race.r} | ${race.date}</p><h1>${race.loc}</h1><p class="full-name">${race.full}</p></div>`;
            
            if (isUpcoming) {
                // Show countdown sessions for upcoming/current weekend
                race.sessions.forEach(s => {
                    const target = new Date(s.t);
                    const diff = target - now;
                    let txt = "LIVE";
                    if (diff > 0) {
                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const sec = Math.floor((diff % 60000) / 1000);
                        txt = `${d > 0 ? d + 'd ' : ''}${h}h ${m}m ${sec}s`;
                    } else if (diff < -7200000) { 
                        txt = "FINISHED"; 
                    }

                    html += `<div class="session-row">
                                <div>
                                    <div class="name">${s.n}</div>
                                    <div class="ist">${target.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })} IST</div>
                                </div>
                                <div class="timer">${txt}</div>

                                    </div>
                                `).join('')}
                            </div>
                         </div>`;
            } else {
                // Show Podiums for past races
                html += `<div class="info-card">
                            <h3>Race Podium Results</h3>
                            <div class="podium-list">
                                <div class="podium-item"><span class="pos-badge">1st</span> <strong>🏆 ${race.podium[0]}</strong></div>
                                <div class="podium-item"><span class="pos-badge">2nd</span> <strong>🥈 ${race.podium[1]}</strong></div>
                                <div class="podium-item"><span class="pos-badge">3rd</span> <strong>🥉 ${race.podium[2]}</strong></div>
                            </div>
                         </div>`;
            }

            document.getElementById('ui').innerHTML = html;
        }

        window.addEventListener('load', () => { 
            const v = document.getElementById('video-bg');
            v.play().catch(() => { console.log("Autoplay blocked"); });
            renderSidebar();
            up();
        });

        setInterval(up, 1000);
    </script>
